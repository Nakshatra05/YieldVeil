name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run contracts:build
      - run: git diff --exit-code -- public/contracts/artifacts.json public/contracts/routes.json
      - run: npm run test:protocol
      - run: npm run build
